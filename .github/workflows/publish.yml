name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: themranderson/pi-hole-cloudfare-doh

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Pi-hole base tag
        id: base
        run: |
          PIHOLE_TAG="$(grep -E '^FROM pihole/pihole:' Dockerfile | head -n1 | sed -E 's#^FROM pihole/pihole:([^[:space:]]+).*#\1#')"
          if [ -z "${PIHOLE_TAG}" ]; then
            echo "Unable to determine Pi-hole base tag from Dockerfile" >&2
            exit 1
          fi
          docker pull --quiet "pihole/pihole:${PIHOLE_TAG}" >/dev/null
          PIHOLE_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "pihole/pihole:${PIHOLE_TAG}")"
          echo "pihole_tag=${PIHOLE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "pihole_image_id=${PIHOLE_IMAGE_ID}" >> "${GITHUB_OUTPUT}"
          echo "Using pihole/pihole:${PIHOLE_TAG} (${PIHOLE_IMAGE_ID})"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          pull: true
          load: true
          build-args: |
            PIHOLE_BASE_TAG=${{ steps.base.outputs.pihole_tag }}
            PIHOLE_BASE_IMAGE_ID=${{ steps.base.outputs.pihole_image_id }}
          tags: local/pi-hole-cloudfare-doh:publish-test

      - name: Push image tags
        uses: docker/build-push-action@v7
        with:
          pull: true
          push: true
          build-args: |
            PIHOLE_BASE_TAG=${{ steps.base.outputs.pihole_tag }}
            PIHOLE_BASE_IMAGE_ID=${{ steps.base.outputs.pihole_image_id }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:pihole-${{ steps.base.outputs.pihole_tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dump logs on failure
        if: failure()
        run: echo "Publish failed before/while push step"

      - name: Cleanup
        if: always()
        run: true
